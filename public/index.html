<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        #app {
            text-align: center;
        }
        canvas {
            border: 2px solid #fff;
            background-color: #000;
        }
        .score {
            color: #fff;
            font-size: 24px;
            margin: 10px 0;
        }
        .controls {
            color: #fff;
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="score">
            <span>Player: <span id="player1-score">0</span></span>
            <span style="margin: 0 20px;">|</span>
            <span>Computer: <span id="player2-score">0</span></span>
        </div>
        <div class="score" style="font-size: 16px; margin-bottom: 10px;">
            <span>Speed: <span id="speed-multiplier">1.0</span>x</span>
            <span style="margin: 0 20px;">|</span>
            <span>Rallies: <span id="collision-count">0</span></span>
        </div>
        <canvas id="game-canvas" width="800" height="400"></canvas>
        <div class="controls">
            <p>Player Controls: Up/Down arrow keys to move paddle</p>
            <p>Press SPACE to start/pause</p>
            <p>Speed increases every 2 paddle hits!</p>
        </div>
    </div>
    <script src="/js/main.js"></script>
</body>
</html>
